name: Build & Release APK

on:
  push:
    branches:
      - fongmi
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank for default version v5.7.2)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release FongMi TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Download Player Dependencies (Media3 AARs)
        run: |
          mkdir -p app/libs
          echo "Downloading Media3 AAR dependencies..."
          curl -fSL --retry 5 --retry-delay 3 "https://github.com/lublue147-netizen/TV/releases/download/v5.6.3/media3-aars.zip" -o /tmp/media3-aars.zip || \
          curl -fSL --retry 5 --retry-delay 3 "https://github.com/top355/media/releases/download/libs/media3-aars.zip" -o /tmp/media3-aars.zip
          unzip -t /tmp/media3-aars.zip
          unzip -q -o /tmp/media3-aars.zip -d app/libs/
          ls -lh app/libs/

      - name: Setup Keystore
        run: |
          mkdir -p app
          if [ -f "app/release.jks.base64" ]; then
            echo "Decoding permanent release.jks from app/release.jks.base64..."
            base64 -d app/release.jks.base64 > app/release.jks
          elif [ ! -f "app/release.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore app/release.jks \
              -alias fongmi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=FongMi, OU=TV, O=FongMi, L=Taipei, S=TW, C=TW"
          fi
          ls -lh app/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Google Services (Firebase)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
            echo "google-services.json decoded from secret"
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json already exists in repo"
          else
            echo "WARNING: No google-services.json found"
          fi

      - name: Build Leanback and Mobile Release APKs
        run: |
          export GRADLE_OPTS="-Xmx4096m -XX:+UseG1GC"
          ./gradlew :app:assembleLeanbackRelease --no-daemon --stacktrace
          ./gradlew :app:assembleMobileRelease --no-daemon --stacktrace

      - name: Check Output APKs
        run: |
          mkdir -p Release/apk
          ls -lh Release/apk/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-APKs
          path: Release/apk/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          VERSION="v5.7.5"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=FongMi TV ${TAG}" >> $GITHUB_OUTPUT

      - name: Generate Build Summary
        run: |
          echo "### 🚀 FongMi TV APK 构建与发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${{ steps.release_info.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **包含产物**:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`leanback-arm64_v8a.apk\` (电视版 64位)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`leanback-armeabi_v7a.apk\` (电视版 32位)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`mobile-arm64_v8a.apk\` (手机版 64位)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`mobile-armeabi_v7a.apk\` (手机版 32位)" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/fongmi' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: Release/apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
