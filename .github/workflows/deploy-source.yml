name: Deploy Subscription Source

on:
  push:
    paths:
      - 'subscription/**'
      - '.github/workflows/deploy-source.yml'
    branches:
      - fongmi
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile Spider JAR from Java Sources
        run: |
          if [ -d "subscription/spider_source/src" ]; then
            echo "=== Compiling Spider Java Sources ==="
            mkdir -p build_spider/classes
            javac -source 17 -target 17 \
              -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
              -d build_spider/classes \
              $(find subscription/spider_source/src -name "*.java")

            echo "=== Converting to DEX via D8 ==="
            $ANDROID_HOME/build-tools/34.0.0/d8 --output build_spider/ $(find build_spider/classes -name "*.class")

            echo "=== Packaging spider_open.jar ==="
            cd build_spider && jar cf spider_open.jar classes.dex && cd ..
            mkdir -p subscription/spider
            cp build_spider/spider_open.jar subscription/spider/spider_open.jar
            echo "=== Open-Source Spider JAR compilation successful ==="
          fi

      - name: Build Subscription Source
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 subscription/scripts/build_source.py

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./subscription/dist_source
          publish_branch: gh-pages
          force_orphan: true

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "=== Purging jsDelivr CDN Cache ==="
          REPO="${{ github.repository }}"
          sleep 5
          for file in accelerated.json accelerated_open.json open.json aiwex.json custom.json index.json token.json spider.txt spider.jar spider_open.txt spider_open.jar index.html live/iptv.m3u; do
            echo "Purging ${file}..."
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@gh-pages/${file}" || true
          done
          echo "=== jsDelivr Cache Purge Completed ==="

      - name: Generate Summary
        run: |
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}/aiwex.json"
          CDN_URL="https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/aiwex.json"
          GHPROXY_URL="https://ghproxy.net/https://raw.githubusercontent.com/${REPO}/fongmi/subscription/config/aiwex.json"

          echo "### 🚀 TVBox / FongMi 影视源构建与发布完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "可以直接将以下任一链接复制粘贴至 TVBox / FongMi 客户端：「设置」->「配置地址」" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 线路类型 | 接口订阅地址 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **jsDelivr 高速 CDN (推荐)** | \`${CDN_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **GitHub Pages 官方线路** | \`${PAGES_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **GitHub 镜像加速源** | \`${GHPROXY_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **精简核心源 (Custom)** | \`https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/custom.json\` |" >> $GITHUB_STEP_SUMMARY
