name: Build and Release Subscription & GoProxy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: get_tag
        run: |
          echo "=== Determining Release Tag ==="
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Building from pushed tag: $TAG"
          else
            git fetch --tags || true
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v1.0.4"
            else
              MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
              MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
              PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
              NEXT_PATCH=$((PATCH + 1))
              TAG="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
            echo "Auto-incremented release tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG" || true
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android NDK
        run: |
          echo "=== Setting up Android NDK ==="
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_DIR"

      - name: Build GoProxy Binaries & SO Dynamic Libraries
        run: |
          echo "=== Compiling GoProxy Static Binaries ==="
          mkdir -p goproxy/bin
          cd goproxy

          # 1. Android ARM64
          echo "Building goproxy-android-arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/goproxy-android-arm64 .

          # 2. Android ARMv7 (32-bit)
          echo "Building goproxy-android-armv7..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o bin/goproxy-android-armv7 .

          # 3. Linux x86_64
          echo "Building goproxy-linux-amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/goproxy-linux-amd64 .

          # 4. Windows x86_64
          echo "Building goproxy-windows-amd64.exe..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/goproxy-windows-amd64.exe .

          echo "=== Compiling Android Native SO via NDK Clang ==="
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

            # Find ARM64 Clang
            CC_ARM64=$(find "$TOOLCHAIN" -name "aarch64-linux-android*clang" | head -n 1)
            if [ -n "$CC_ARM64" ]; then
              echo "Building arm64-v8a libgoproxy.so using $CC_ARM64..."
              mkdir -p bin/arm64-v8a
              CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC_ARM64" CGO_CFLAGS="-I$SYSROOT/usr/include" \
                go build -buildmode=c-shared -ldflags="-s -w" -o bin/arm64-v8a/libgoproxy.so . || echo "Warning: ARM64 SO build failed"
            fi

            # Find ARMv7 Clang
            CC_ARM=$(find "$TOOLCHAIN" -name "armv7a-linux-androideabi*clang" | head -n 1)
            if [ -n "$CC_ARM" ]; then
              echo "Building armeabi-v7a libgoproxy.so using $CC_ARM..."
              mkdir -p bin/armeabi-v7a
              CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC="$CC_ARM" CGO_CFLAGS="-I$SYSROOT/usr/include" \
                go build -buildmode=c-shared -ldflags="-s -w" -o bin/armeabi-v7a/libgoproxy.so . || echo "Warning: ARMv7 SO build failed"
            fi
          fi

          cd ..
          echo "=== GoProxy Build Completed ==="
          find goproxy/bin -type f

      - name: Compile Spider JAR from Java Sources
        run: |
          if [ -d "spider_source/src" ]; then
            echo "=== Compiling Spider Java Sources ==="
            mkdir -p build_spider/classes
            javac -source 8 -target 8 \
              -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
              -d build_spider/classes \
              $(find spider_source/src -name "*.java")

            echo "=== Converting to DEX via D8 ==="
            $ANDROID_HOME/build-tools/34.0.0/d8 --min-api 21 --output build_spider/ $(find build_spider/classes -name "*.class")

            echo "=== Packaging spider_open.jar ==="
            cd build_spider && jar cf spider_open.jar classes.dex && cd ..
            mkdir -p spider
            cp build_spider/spider_open.jar spider/spider_open.jar
            cp build_spider/spider_open.jar spider/custom_spider.jar
            echo "=== Open-Source Spider JAR packaging successful ==="
          fi

      - name: Build Subscription Distributions & Web Portal
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 scripts/build_source.py

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_source
          publish_branch: gh-pages
          keep_files: true

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "=== Purging jsDelivr CDN Cache ==="
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          sleep 5
          for file in accelerated.json accelerated_open.json open.json aiwex.json custom.json index.json token.json spider.txt spider.jar spider_open.txt spider_open.jar index.html live/iptv.m3u; do
            echo "Purging root ${file}..."
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@gh-pages/${file}" || true
            echo "Purging ${TAG}/${file}..."
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@gh-pages/${TAG}/${file}" || true
          done
          echo "=== jsDelivr Cache Purge Completed ==="

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TVBox / FongMi 影视源与 GoProxy 网盘加速器 ${{ env.RELEASE_TAG }} 正式版
          body: |
            ### 🚀 TVBox / FongMi 影视源与网盘加速代理 ${{ env.RELEASE_TAG }} 正式版发布

            #### 📌 本版本专属固定订阅链接 (多版本共存 · 永久有效不随更新变更)：
            - **开源原生极速源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/${{ env.RELEASE_TAG }}/accelerated_open.json`
            - **全功能聚合源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/${{ env.RELEASE_TAG }}/aiwex.json`
            - **精简核心源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/${{ env.RELEASE_TAG }}/custom.json`
            - **GitHub Pages 线路**: `https://${{ github.repository_owner }}.github.io/subscription/${{ env.RELEASE_TAG }}/accelerated_open.json`

            #### 🔄 最新动态订阅链接 (自动跟随最新版本更新)：
            - **开源原生极速源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/accelerated_open.json`
            - **全功能聚合源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/aiwex.json`
            - **精简核心源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/custom.json`
            - **直播源**: `https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/live/iptv.m3u`

            #### 🌟 ${{ env.RELEASE_TAG }} 核心特性：
            - **多版本持久化隔离**: 每次发布均打独立不可覆盖的语义化 Tag，并在 `gh-pages` 与 GitHub Releases 永久归档，保证各个历史版本的订阅链接持续可用。
            - **Go / SO 网盘并发加速引擎 (GoProxy)**: 针对夸克、阿里、115等网盘多协程 Range 并发分块预加载，秒播 4K 蓝光高码率原盘。
            - **100% 纯 Java 开源 Spider (spider_open.jar)**: 内置纯本地离线扫码二维码生成引擎、后台自动轮询登录、局域网 Web 控制台 (9979端口) 以及千万级 PanSearch 多网盘秒搜。

            #### 包含附件：
            - `accelerated_open.json`: 纯开源原生源订阅配置 (DEX Spider)
            - `aiwex.json`: 全功能聚合源订阅配置
            - `custom.json`: 精简核心源订阅配置
            - `spider_open.jar`: 纯开源网盘扫码配置与 4K 秒搜爬虫 (DEX 打包)
            - `spider.jar`: 增强型全能爬虫
            - `goproxy-android-arm64`: 适用于 Android 64位智能电视盒子的后台加速守护进程
            - `goproxy-android-armv7`: 适用于 32位老款盒子的后台加速守护进程
            - `libgoproxy.so`: Android JNI 原生动态链接库
            - `goproxy-linux-amd64`: Linux / NAS / 软路由加速器
            - `goproxy-windows-amd64.exe`: Windows PC 加速器
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            spider/spider.jar
            spider/spider_open.jar
            dist_source/accelerated_open.json
            dist_source/accelerated.json
            dist_source/aiwex.json
            dist_source/custom.json
            dist_source/index.json
            dist_source/token.json
            goproxy/bin/goproxy-android-arm64
            goproxy/bin/goproxy-android-armv7
            goproxy/bin/goproxy-linux-amd64
            goproxy/bin/goproxy-windows-amd64.exe
            goproxy/bin/arm64-v8a/libgoproxy.so
            goproxy/bin/armeabi-v7a/libgoproxy.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Workflow Summary
        run: |
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO#*/}"
          TAG="${{ env.RELEASE_TAG }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}/${TAG}/accelerated_open.json"
          CDN_VER_URL="https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/${TAG}/accelerated_open.json"
          CDN_LATEST_URL="https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/accelerated_open.json"

          echo "### 🚀 TVBox / FongMi 影视源与 GoProxy 加速引擎 ${TAG} 发布成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 接口类型 | 订阅配置链接 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📌 **本版本专属开源源 (${TAG})** | \`${CDN_VER_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 **最新动态开源源 (自动跟新)** | \`${CDN_LATEST_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **全功能聚合源 (${TAG})** | \`https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/${TAG}/aiwex.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **精简核心源 (${TAG})** | \`https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/${TAG}/custom.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📡 **GitHub Pages 线路** | \`${PAGES_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📺 **高清直播源 (IPTV M3U)** | \`https://cdn.jsdelivr.net/gh/${REPO}@gh-pages/${TAG}/live/iptv.m3u\` |" >> $GITHUB_STEP_SUMMARY
